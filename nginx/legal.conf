server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    location = /legal {
        return 301 /legal/;
    }

    location /legal/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = /doneaza {
        return 301 /doneaza/;
    }

    location /doneaza/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = / {
        return 302 /legal/;
    }
}
